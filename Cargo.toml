[package]
name = "ai-tool-dashboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "A small native dashboard for AI agent usage and activity"

[features]
default = []
gpu = ["slint/renderer-femtovg"]
verification = ["dep:png"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "accessibility", "unstable-winit-030", "system-tray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
png = { version = "0.18", optional = true }
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"
whoami = { version = "2.1", default-features = false, features = ["std"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
